name: Build IPA

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project HellKnight.xcodeproj \
            -scheme HellKnight \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1 || {
              echo "::group::Compiler errors"
              grep -E "error:" -A 4 build.log | head -300
              echo "::endgroup::"
              tail -60 build.log
              exit 1
            }
          grep -E "warning:" build.log | sort -u | head -50 || true
          tail -5 build.log

      - name: Package IPA
        run: |
          APP=build/Build/Products/Release-iphoneos/HellKnight.app
          test -d "$APP"
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          zip -qry HellKnight.ipa Payload
          ls -lh HellKnight.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: HellKnight-ipa
          path: HellKnight.ipa

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Publish "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest HellKnight.ipa \
            --target "${{ github.sha }}" \
            --title "HellKnight (latest build #${{ github.run_number }})" \
            --notes "Unsigned IPA for sideloading (AltStore, SideStore, Sideloadly, TrollStore, etc.). Built from ${{ github.ref_name }} @ ${{ github.sha }}." \
            --prerelease
