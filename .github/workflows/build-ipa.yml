name: Build IPA

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project HellKnight.xcodeproj \
            -scheme HellKnight \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1 || {
              echo "::group::Compiler errors"
              grep -E "error:" -A 4 build.log | head -300
              echo "::endgroup::"
              tail -60 build.log
              exit 1
            }
          grep -E "warning:" build.log | sort -u | head -50 || true
          tail -5 build.log

      - name: Package IPA
        run: |
          APP=build/Build/Products/Release-iphoneos/HellKnight.app
          test -d "$APP"
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          zip -qry HellKnight.ipa Payload
          ls -lh HellKnight.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: HellKnight-ipa
          path: HellKnight.ipa

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Publish "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest HellKnight.ipa \
            --target "${{ github.sha }}" \
            --title "HellKnight (latest build #${{ github.run_number }})" \
            --notes "Unsigned IPA for sideloading (AltStore, SideStore, Sideloadly, TrollStore, etc.). Built from ${{ github.ref_name }} @ ${{ github.sha }}." \
            --prerelease

  screenshots:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Boot simulator
        run: |
          xcrun simctl list devices available
          UDID=$(xcrun simctl list devices available | grep -E "iPhone 16 Pro \(" | head -1 | grep -oE '[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}')
          if [ -z "$UDID" ]; then
            UDID=$(xcrun simctl list devices available | grep -E "iPhone" | head -1 | grep -oE '[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}')
          fi
          echo "Using $UDID"
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b

      - name: Build for simulator
        run: |
          xcodebuild \
            -project HellKnight.xcodeproj \
            -scheme HellKnight \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "id=$UDID" \
            -derivedDataPath simbuild \
            build > sim.log 2>&1 || {
              grep -E "error:" -A 4 sim.log | head -200
              tail -60 sim.log
              exit 1
            }

      - name: Capture screenshots
        run: |
          APP=simbuild/Build/Products/Debug-iphonesimulator/HellKnight.app
          xcrun simctl install "$UDID" "$APP"
          mkdir -p shots
          for s in title sanctum game boon game1 game2 boss; do
            xcrun simctl launch "$UDID" com.hellknight.game -shot "$s"
            sleep 10
            xcrun simctl io "$UDID" screenshot "shots/$s.png"
            xcrun simctl terminate "$UDID" com.hellknight.game || true
            sleep 2
          done
          for f in shots/*.png; do
            w=$(sips -g pixelWidth "$f" | awk '/pixelWidth/{print $2}')
            h=$(sips -g pixelHeight "$f" | awk '/pixelHeight/{print $2}')
            if [ "$h" -gt "$w" ]; then sips -r 270 "$f" > /dev/null; fi
          done
          ls -la shots

      - name: Upload screenshots artifact
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shots

      - name: Publish screenshots release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete screenshots --yes --cleanup-tag || true
          gh release create screenshots shots/*.png \
            --target "${{ github.sha }}" \
            --title "Screenshots (build #${{ github.run_number }})" \
            --notes "Simulator screenshots from ${{ github.sha }}." \
            --prerelease
