name: HellKnight
options:
  bundleIdPrefix: com.hellknight
  deploymentTarget:
    iOS: "15.0"
targets:
  HellKnight:
    type: application
    platform: iOS
    sources:
      - path: HellKnight
    scheme: {}
    settings:
      base:
        PRODUCT_NAME: HellKnight
        PRODUCT_BUNDLE_IDENTIFIER: com.hellknight.game
        INFOPLIST_FILE: HellKnight/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        ENABLE_BITCODE: NO
